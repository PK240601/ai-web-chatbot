<!DOCTYPE html>
<html lang="en" class="h-full">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Core Assistant</title>
    <!-- Load Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Premium Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Load Marked JS for dynamic Markdown parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
    <!-- Load Highlight.js and a dark theme style -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    animation: {
                        'blob': 'blob 10s infinite',
                        'fade-in-up': 'fadeInUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                    },
                    keyframes: {
                        blob: {
                            '0%, 100%': { transform: 'translate(0px, 0px) scale(1)' },
                            '33%': { transform: 'translate(30px, -50px) scale(1.15)' },
                            '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                        },
                        fadeInUp: {
                            '0%': { opacity: '0', transform: 'translateY(12px) scale(0.98)' },
                            '100%': { opacity: '1', transform: 'translateY(0) scale(1)' },
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        /* Custom scrollbar styling for a sleeker look */
        #chat-box::-webkit-scrollbar {
            width: 6px;
        }
        #chat-box::-webkit-scrollbar-track {
            background: transparent;
        }
        #chat-box::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 9999px;
        }
        #chat-box::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        /* Glassmorphism custom styling utilities */
        .glass-panel {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glass-input {
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .glass-input:focus {
            border-color: rgba(16, 185, 129, 0.4);
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.15);
        }

        /* Markdown styling inside chatbot replies */
        .prose-custom p {
            margin-bottom: 0.75rem;
        }
        .prose-custom p:last-child {
            margin-bottom: 0;
        }
        .prose-custom ul, .prose-custom ol {
            margin-left: 1.25rem;
            margin-bottom: 0.75rem;
            list-style-type: disc;
        }
        .prose-custom ol {
            list-style-type: decimal;
        }
        .prose-custom li {
            margin-bottom: 0.25rem;
        }
        .prose-custom code {
            font-family: monospace;
            background: rgba(255, 255, 255, 0.1);
            padding: 0.125rem 0.25rem;
            border-radius: 0.25rem;
            font-size: 0.875rem;
        }
        .prose-custom pre {
            background: rgba(10, 15, 30, 0.7) !important;
            padding: 0.75rem;
            border-radius: 0.5rem;
            overflow-x: auto;
            margin: 0.75rem 0;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .prose-custom pre code {
            background: transparent !important;
            padding: 0 !important;
            border-radius: 0;
        }
    </style>
</head>

<body class="bg-slate-950 text-slate-100 flex flex-col items-center justify-center min-h-screen p-4 overflow-hidden relative font-sans">

    <!-- Background glowing accent blobs -->
    <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-emerald-500/10 rounded-full filter blur-[80px] animate-blob -z-10"></div>
    <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-teal-500/10 rounded-full filter blur-[80px] animate-blob [animation-delay:3s] -z-10"></div>

    <!-- Main Chat Card Container -->
    <div class="w-full max-w-2xl glass-panel rounded-2xl shadow-2xl flex flex-col h-[700px] overflow-hidden transition-all duration-300 hover:shadow-[0_0_50px_-12px_rgba(16,185,129,0.12)]">

        <!-- Header Area -->
        <header class="px-6 py-4 border-b border-white/5 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <!-- Status indicator dot with triple ring pulse -->
                <div class="relative flex h-3.5 w-3.5">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-3.5 w-3.5 bg-emerald-500"></span>
                </div>
                <div>
                    <h1 class="font-bold text-base tracking-tight text-white">AI Core</h1>
                    <p class="text-xs text-slate-400 flex items-center gap-1" id="status-text">Ready to help</p>
                </div>
            </div>
            
            <div class="flex items-center gap-2">
                <select id="model-select" class="text-xs bg-slate-900/90 text-emerald-400 border border-emerald-500/20 rounded-full px-3 py-1.5 font-medium outline-none focus:ring-1 focus:ring-emerald-500 transition-all duration-200 cursor-pointer">
                    <option value="gpt-5.4-mini">gpt-5.4-mini</option>
                    <option value="gpt-5.4-nano">gpt-5.4-nano</option>
                    <option value="gpt-5-mini">gpt-5-mini</option>
                    <option value="gpt-5-nano">gpt-5-nano</option>
                    <option value="gpt-4.1-mini">gpt-4.1-mini</option>
                    <option value="gpt-4.1-nano">gpt-4.1-nano</option>
                    <option value="gpt-4o-mini" selected>gpt-4o-mini</option>
                    <option value="o3-mini">o3-mini</option>
                    <option value="o4-mini">o4-mini</option>
                </select>
                <button type="button" id="clear-btn" class="text-slate-400 hover:text-rose-400 p-1.5 rounded-lg hover:bg-white/5 transition duration-200 cursor-pointer flex items-center justify-center" title="Clear Chat">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0" />
                    </svg>
                </button>
            </div>
        </header>

        <!-- Scrollable Chat Messages Window -->
        <div id="chat-box" class="flex-1 overflow-y-auto p-6 space-y-6">
            <!-- Initial greeting message from the bot -->
            <div class="flex items-start gap-3.5 animate-fade-in-up">
                <!-- Avatar placeholder -->
                <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-emerald-600 to-teal-500 flex items-center justify-center shadow-lg flex-shrink-0 text-white font-semibold text-xs">
                    AI
                </div>
                <div class="glass-panel px-4 py-3 rounded-2xl rounded-tl-sm text-sm text-slate-200 max-w-[80%] leading-relaxed shadow-sm">
                    Hello! How can I assist you with your questions today?
                </div>
            </div>
        </div>

        <!-- Message Input Form -->
        <form id="chat-form" class="p-4 border-t border-white/5 flex gap-3 items-center">
            <div class="flex-1 relative flex items-center">
                <input type="text" id="user-input" placeholder="Ask anything..." required autocomplete="off"
                    class="w-full glass-input rounded-xl pl-4 pr-12 py-3 text-sm focus:outline-none transition-all duration-300 text-white placeholder-slate-400" />
            </div>
            <button type="submit" id="send-btn"
                class="bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white p-3 rounded-xl transition duration-200 disabled:opacity-50 disabled:scale-100 flex items-center justify-center shadow-lg shadow-emerald-950/20 hover:shadow-emerald-500/20">
                <!-- Send Icon -->
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 12L3.269 3.126A59.768 59.768 0 0121.485 12 59.77 59.77 0 013.27 20.876L5.999 12zm0 0h7.5" />
                </svg>
            </button>
        </form>
    </div>

    <!-- Frontend Logic -->
    <script>
        const form = document.getElementById("chat-form");
        const input = document.getElementById("user-input");
        const chatBox = document.getElementById("chat-box");
        const sendBtn = document.getElementById("send-btn");
        const statusText = document.getElementById("status-text");
        const modelSelect = document.getElementById("model-select");
        const clearBtn = document.getElementById("clear-btn");

        // Default greeting message
        const defaultHistory = [
            { role: "assistant", content: "Hello! How can I assist you with your questions today?" }
        ];

        // Maintain conversation history - load from localStorage if exists
        let chatHistory = JSON.parse(localStorage.getItem("ai_chat_history")) || [...defaultHistory];

        // Save conversation history to localStorage
        function saveChatHistory() {
            localStorage.setItem("ai_chat_history", JSON.stringify(chatHistory));
        }

        // Render all messages in history
        function renderAllMessages() {
            chatBox.innerHTML = "";
            chatHistory.forEach((msg) => {
                const sender = msg.role === "assistant" ? "bot" : "user";
                appendMessage(sender, msg.content);
            });
        }

        // Custom renderer configurations for Marked
        marked.setOptions({
            breaks: true,
            gfm: true
        });

        /**
         * Appends a message bubble into the chat box.
         * @param {string} sender - "user" or "bot"
         * @param {string} text - The message text content
         */
        function appendMessage(sender, text) {
            const wrapper = document.createElement("div");
            wrapper.className = sender === "user" 
                ? "flex justify-end animate-fade-in-up" 
                : "flex items-start gap-3.5 animate-fade-in-up";

            if (sender === "user") {
                const bubble = document.createElement("div");
                bubble.className = "bg-gradient-to-r from-emerald-600 to-teal-600 text-white px-4 py-3 rounded-2xl rounded-tr-sm text-sm max-w-[80%] leading-relaxed shadow-lg shadow-emerald-950/20";
                bubble.textContent = text;
                wrapper.appendChild(bubble);
            } else {
                // Avatar
                const avatar = document.createElement("div");
                avatar.className = "w-8 h-8 rounded-full bg-gradient-to-tr from-emerald-600 to-teal-500 flex items-center justify-center shadow-lg flex-shrink-0 text-white font-semibold text-xs";
                avatar.textContent = "AI";
                wrapper.appendChild(avatar);

                const bubble = document.createElement("div");
                bubble.className = "glass-panel px-4 py-3 rounded-2xl rounded-tl-sm text-sm text-slate-200 max-w-[80%] leading-relaxed shadow-sm prose-custom";
                // Safely parse Markdown for bot replies
                bubble.innerHTML = marked.parse(text);

                // Dynamically apply code highlighting and copy buttons
                bubble.querySelectorAll("pre").forEach((pre) => {
                    const code = pre.querySelector("code");
                    if (code) {
                        hljs.highlightElement(code);
                    }

                    // Setup pre container styles for copy button layout
                    pre.classList.add("relative", "group");

                    // Create the glassmorphic Copy button
                    const copyBtn = document.createElement("button");
                    copyBtn.type = "button";
                    copyBtn.className = "absolute top-2.5 right-2.5 opacity-0 group-hover:opacity-100 transition-opacity duration-200 bg-slate-800/90 hover:bg-slate-700/90 border border-white/10 text-slate-300 hover:text-white px-2 py-1 rounded-md text-[10px] font-semibold flex items-center gap-1 cursor-pointer select-none z-10";
                    
                    const copyIcon = `
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 7.5V6.108c0-1.135.845-2.098 1.976-2.192.373-.03.748-.057 1.123-.08M15.75 18H18a2.25 2.25 0 002-2.25V6.108c0-1.135-.845-2.098-1.976-2.192a48.424 48.424 0 00-1.123-.08M15.75 18.75v-1.875a3.375 3.375 0 00-3.375-3.375h-1.5a1.125 1.125 0 01-1.125-1.125v-1.5A3.375 3.375 0 006.375 7.5H5.25m11.9-3.664A2.251 2.251 0 0015 2.25h-1.5a2.251 2.251 0 00-2.15 1.586m5.8 0c.065.21.1.433.1.664v.75h-6V4.5c0-.231.035-.454.1-.664M6.75 7.5H4.875c-.621 0-1.125.504-1.125 1.125v12c0 .621.504 1.125 1.125 1.125h9.75c.621 0 1.125-.504 1.125-1.125V16.5a9 9 0 00-9-9z" />
                        </svg>
                    `;
                    const checkIcon = `
                        <svg class="w-3 h-3 text-emerald-400" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" />
                        </svg>
                    `;

                    copyBtn.innerHTML = `${copyIcon}<span>Copy</span>`;
                    pre.appendChild(copyBtn);

                    // Add click event for copy functionality
                    copyBtn.addEventListener("click", async () => {
                        const textToCopy = code ? code.innerText : pre.innerText;
                        try {
                            await navigator.clipboard.writeText(textToCopy);
                            copyBtn.innerHTML = `${checkIcon}<span class="text-emerald-400">Copied!</span>`;
                            copyBtn.classList.add("border-emerald-500/30");
                            
                            setTimeout(() => {
                                copyBtn.innerHTML = `${copyIcon}<span>Copy</span>`;
                                copyBtn.classList.remove("border-emerald-500/30");
                            }, 2000);
                        } catch (err) {
                            console.error("Failed to copy text: ", err);
                        }
                    });
                });

                wrapper.appendChild(bubble);
            }

            chatBox.appendChild(wrapper);
            // Auto-scroll to the newest message
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        /**
         * Display thinking dot animation bubble.
         */
        let typingIndicator = null;
        function showTypingIndicator() {
            if (typingIndicator) return;
            
            statusText.textContent = "Thinking...";
            statusText.classList.add("text-emerald-400");
            
            typingIndicator = document.createElement("div");
            typingIndicator.className = "flex items-start gap-3.5 animate-fade-in-up id-typing";
            
            typingIndicator.innerHTML = `
                <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-emerald-600 to-teal-500 flex items-center justify-center shadow-lg flex-shrink-0 text-white font-semibold text-xs">
                    AI
                </div>
                <div class="glass-panel px-5 py-4 rounded-2xl rounded-tl-sm flex items-center gap-1.5 shadow-sm">
                    <span class="w-2.5 h-2.5 bg-slate-400 rounded-full animate-bounce" style="animation-delay: 0ms"></span>
                    <span class="w-2.5 h-2.5 bg-slate-400 rounded-full animate-bounce" style="animation-delay: 150ms"></span>
                    <span class="w-2.5 h-2.5 bg-slate-400 rounded-full animate-bounce" style="animation-delay: 300ms"></span>
                </div>
            `;
            
            chatBox.appendChild(typingIndicator);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        /**
         * Hide the thinking bubble.
         */
        function hideTypingIndicator() {
            if (typingIndicator) {
                typingIndicator.remove();
                typingIndicator = null;
            }
            statusText.textContent = "Ready to help";
            statusText.classList.remove("text-emerald-400");
        }

        // Handle form submit (pressing Enter or clicking Send)
        form.addEventListener("submit", async (e) => {
            e.preventDefault(); // Prevent page reload
            const prompt = input.value.trim();
            if (!prompt) return;

            // 1. Display user message immediately on UI
            appendMessage("user", prompt);
            chatHistory.push({ role: "user", content: prompt });
            saveChatHistory();
            input.value = "";
            sendBtn.disabled = true;
            
            // 2. Show dynamic typing/thinking indicator
            showTypingIndicator();

            try {
                // 3. Send the question to the Flask backend (/ask endpoint)
                const response = await fetch("/ask", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ 
                        messages: chatHistory,
                        model: modelSelect.value
                    })
                });

                const data = await response.json();
                
                // Hide dynamic typing bubble before rendering answer
                hideTypingIndicator();

                // 4. Render the bot's response or error
                if (response.ok && data.reply) {
                    appendMessage("bot", data.reply);
                    chatHistory.push({ role: "assistant", content: data.reply });
                    saveChatHistory();
                } else {
                    appendMessage("bot", `Error: ${data.error || "Unable to get response"}`);
                }
            } catch (err) {
                hideTypingIndicator();
                appendMessage("bot", "Network error: Could not reach the server.");
            } finally {
                // Re-enable the send button and focus the input field
                sendBtn.disabled = false;
                input.focus();
            }
        });

        // Bind clear chat button event listener
        clearBtn.addEventListener("click", () => {
            if (confirm("Are you sure you want to clear this conversation?")) {
                chatHistory = [...defaultHistory];
                saveChatHistory();
                renderAllMessages();
            }
        });

        // Run initial history render on page load
        renderAllMessages();
    </script>
</body>

</html>
