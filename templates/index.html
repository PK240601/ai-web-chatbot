<!DOCTYPE html>
<html lang="en" class="h-full">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Core Assistant</title>
    <!-- Load Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Premium Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Load Marked JS for dynamic Markdown parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    animation: {
                        'blob': 'blob 10s infinite',
                        'fade-in-up': 'fadeInUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                    },
                    keyframes: {
                        blob: {
                            '0%, 100%': { transform: 'translate(0px, 0px) scale(1)' },
                            '33%': { transform: 'translate(30px, -50px) scale(1.15)' },
                            '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                        },
                        fadeInUp: {
                            '0%': { opacity: '0', transform: 'translateY(12px) scale(0.98)' },
                            '100%': { opacity: '1', transform: 'translateY(0) scale(1)' },
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        /* Custom scrollbar styling for a sleeker look */
        #chat-box::-webkit-scrollbar {
            width: 6px;
        }
        #chat-box::-webkit-scrollbar-track {
            background: transparent;
        }
        #chat-box::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 9999px;
        }
        #chat-box::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        /* Glassmorphism custom styling utilities */
        .glass-panel {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glass-input {
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .glass-input:focus {
            border-color: rgba(16, 185, 129, 0.4);
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.15);
        }

        /* Markdown styling inside chatbot replies */
        .prose-custom p {
            margin-bottom: 0.75rem;
        }
        .prose-custom p:last-child {
            margin-bottom: 0;
        }
        .prose-custom ul, .prose-custom ol {
            margin-left: 1.25rem;
            margin-bottom: 0.75rem;
            list-style-type: disc;
        }
        .prose-custom ol {
            list-style-type: decimal;
        }
        .prose-custom li {
            margin-bottom: 0.25rem;
        }
        .prose-custom code {
            font-family: monospace;
            background: rgba(255, 255, 255, 0.1);
            padding: 0.125rem 0.25rem;
            border-radius: 0.25rem;
            font-size: 0.875rem;
        }
        .prose-custom pre {
            background: rgba(0, 0, 0, 0.4);
            padding: 0.75rem;
            border-radius: 0.5rem;
            overflow-x: auto;
            margin: 0.75rem 0;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .prose-custom pre code {
            background: transparent;
            padding: 0;
            border-radius: 0;
        }
    </style>
</head>

<body class="bg-slate-950 text-slate-100 flex flex-col items-center justify-center min-h-screen p-4 overflow-hidden relative font-sans">

    <!-- Background glowing accent blobs -->
    <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-emerald-500/10 rounded-full filter blur-[80px] animate-blob -z-10"></div>
    <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-teal-500/10 rounded-full filter blur-[80px] animate-blob [animation-delay:3s] -z-10"></div>

    <!-- Main Chat Card Container -->
    <div class="w-full max-w-2xl glass-panel rounded-2xl shadow-2xl flex flex-col h-[700px] overflow-hidden transition-all duration-300 hover:shadow-[0_0_50px_-12px_rgba(16,185,129,0.12)]">

        <!-- Header Area -->
        <header class="px-6 py-4 border-b border-white/5 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <!-- Status indicator dot with triple ring pulse -->
                <div class="relative flex h-3.5 w-3.5">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-3.5 w-3.5 bg-emerald-500"></span>
                </div>
                <div>
                    <h1 class="font-bold text-base tracking-tight text-white">AI Core</h1>
                    <p class="text-xs text-slate-400 flex items-center gap-1" id="status-text">Ready to help</p>
                </div>
            </div>
            
            <div class="text-xs text-emerald-400 bg-emerald-500/10 px-2.5 py-1 rounded-full font-medium border border-emerald-500/20">
                GPT-4o Mini
            </div>
        </header>

        <!-- Scrollable Chat Messages Window -->
        <div id="chat-box" class="flex-1 overflow-y-auto p-6 space-y-6">
            <!-- Initial greeting message from the bot -->
            <div class="flex items-start gap-3.5 animate-fade-in-up">
                <!-- Avatar placeholder -->
                <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-emerald-600 to-teal-500 flex items-center justify-center shadow-lg flex-shrink-0 text-white font-semibold text-xs">
                    AI
                </div>
                <div class="glass-panel px-4 py-3 rounded-2xl rounded-tl-sm text-sm text-slate-200 max-w-[80%] leading-relaxed shadow-sm">
                    Hello! How can I assist you with your questions today?
                </div>
            </div>
        </div>

        <!-- Message Input Form -->
        <form id="chat-form" class="p-4 border-t border-white/5 flex gap-3 items-center">
            <div class="flex-1 relative flex items-center">
                <input type="text" id="user-input" placeholder="Ask anything..." required autocomplete="off"
                    class="w-full glass-input rounded-xl pl-4 pr-12 py-3 text-sm focus:outline-none transition-all duration-300 text-white placeholder-slate-400" />
            </div>
            <button type="submit" id="send-btn"
                class="bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white p-3 rounded-xl transition duration-200 disabled:opacity-50 disabled:scale-100 flex items-center justify-center shadow-lg shadow-emerald-950/20 hover:shadow-emerald-500/20">
                <!-- Send Icon -->
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 12L3.269 3.126A59.768 59.768 0 0121.485 12 59.77 59.77 0 013.27 20.876L5.999 12zm0 0h7.5" />
                </svg>
            </button>
        </form>
    </div>

    <!-- Frontend Logic -->
    <script>
        const form = document.getElementById("chat-form");
        const input = document.getElementById("user-input");
        const chatBox = document.getElementById("chat-box");
        const sendBtn = document.getElementById("send-btn");
        const statusText = document.getElementById("status-text");

        // Custom renderer configurations for Marked
        marked.setOptions({
            breaks: true,
            gfm: true
        });

        /**
         * Appends a message bubble into the chat box.
         * @param {string} sender - "user" or "bot"
         * @param {string} text - The message text content
         */
        function appendMessage(sender, text) {
            const wrapper = document.createElement("div");
            wrapper.className = sender === "user" 
                ? "flex justify-end animate-fade-in-up" 
                : "flex items-start gap-3.5 animate-fade-in-up";

            if (sender === "user") {
                const bubble = document.createElement("div");
                bubble.className = "bg-gradient-to-r from-emerald-600 to-teal-600 text-white px-4 py-3 rounded-2xl rounded-tr-sm text-sm max-w-[80%] leading-relaxed shadow-lg shadow-emerald-950/20";
                bubble.textContent = text;
                wrapper.appendChild(bubble);
            } else {
                // Avatar
                const avatar = document.createElement("div");
                avatar.className = "w-8 h-8 rounded-full bg-gradient-to-tr from-emerald-600 to-teal-500 flex items-center justify-center shadow-lg flex-shrink-0 text-white font-semibold text-xs";
                avatar.textContent = "AI";
                wrapper.appendChild(avatar);

                const bubble = document.createElement("div");
                bubble.className = "glass-panel px-4 py-3 rounded-2xl rounded-tl-sm text-sm text-slate-200 max-w-[80%] leading-relaxed shadow-sm prose-custom";
                // Safely parse Markdown for bot replies
                bubble.innerHTML = marked.parse(text);
                wrapper.appendChild(bubble);
            }

            chatBox.appendChild(wrapper);
            // Auto-scroll to the newest message
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        /**
         * Display thinking dot animation bubble.
         */
        let typingIndicator = null;
        function showTypingIndicator() {
            if (typingIndicator) return;
            
            statusText.textContent = "Thinking...";
            statusText.classList.add("text-emerald-400");
            
            typingIndicator = document.createElement("div");
            typingIndicator.className = "flex items-start gap-3.5 animate-fade-in-up id-typing";
            
            typingIndicator.innerHTML = `
                <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-emerald-600 to-teal-500 flex items-center justify-center shadow-lg flex-shrink-0 text-white font-semibold text-xs">
                    AI
                </div>
                <div class="glass-panel px-5 py-4 rounded-2xl rounded-tl-sm flex items-center gap-1.5 shadow-sm">
                    <span class="w-2.5 h-2.5 bg-slate-400 rounded-full animate-bounce" style="animation-delay: 0ms"></span>
                    <span class="w-2.5 h-2.5 bg-slate-400 rounded-full animate-bounce" style="animation-delay: 150ms"></span>
                    <span class="w-2.5 h-2.5 bg-slate-400 rounded-full animate-bounce" style="animation-delay: 300ms"></span>
                </div>
            `;
            
            chatBox.appendChild(typingIndicator);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        /**
         * Hide the thinking bubble.
         */
        function hideTypingIndicator() {
            if (typingIndicator) {
                typingIndicator.remove();
                typingIndicator = null;
            }
            statusText.textContent = "Ready to help";
            statusText.classList.remove("text-emerald-400");
        }

        // Handle form submit (pressing Enter or clicking Send)
        form.addEventListener("submit", async (e) => {
            e.preventDefault(); // Prevent page reload
            const prompt = input.value.trim();
            if (!prompt) return;

            // 1. Display user message immediately on UI
            appendMessage("user", prompt);
            input.value = "";
            sendBtn.disabled = true;
            
            // 2. Show dynamic typing/thinking indicator
            showTypingIndicator();

            try {
                // 3. Send the question to the Flask backend (/ask endpoint)
                const response = await fetch("/ask", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ prompt: prompt })
                });

                const data = await response.json();
                
                // Hide dynamic typing bubble before rendering answer
                hideTypingIndicator();

                // 4. Render the bot's response or error
                if (response.ok && data.reply) {
                    appendMessage("bot", data.reply);
                } else {
                    appendMessage("bot", `Error: ${data.error || "Unable to get response"}`);
                }
            } catch (err) {
                hideTypingIndicator();
                appendMessage("bot", "Network error: Could not reach the server.");
            } finally {
                // Re-enable the send button and focus the input field
                sendBtn.disabled = false;
                input.focus();
            }
        });
    </script>
</body>

</html>
